# Only fire when the scraped data tree actually changes ON MAIN. Pushes that
# touch only scripts, workflows, .gitignore, or other repo plumbing should NOT
# wake the downstream wehoop-wbb-data parser.
#
# The `branches` filter is load-bearing and was missing: any feature-branch
# push touching wbb/** dispatched a production data build. Worse, the
# downstream job derives START_YEAR/END_YEAR by running `grep -oE '[0-9]+'`
# over the COMMIT MESSAGE, so an ordinary development commit body (which is
# full of numbers) either fails the run or builds nonsense seasons. Only the
# bot's "WBB Raw Update (Start: YYYY End: YYYY)" commits are safe input, and
# those only ever land on main.
on:
  push:
    branches:
      - main
    paths:
      - 'wbb/**'
  workflow_dispatch:

name: wehoop WBB Data trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    wehoop_wbb_data_trigger:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger wehoop WBB Data
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.SDV_GH_TOKEN }}
                  repository: sportsdataverse/wehoop-wbb-data
                  event-type: daily_wbb_data
                  # `toJSON(...)` properly escapes embedded newlines, quotes, and
                  # control characters in the commit message so the
                  # client-payload stays valid JSON. Multi-line commit bodies
                  # broke the previous interpolation with
                  # `Bad control character in string literal in JSON at
                  # position N`.
                  client-payload: |-
                    {
                      "ref": "refs/heads/main",
                      "event_name": "daily_wbb_data",
                      "commit_message": ${{ toJSON(github.event.head_commit.message) }}
                    }
