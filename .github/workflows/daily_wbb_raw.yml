name: Daily WBB Raw Scrape

# Umbrella workflow that runs every per-dataset Python scraper in sequence and
# commits the cumulative output in a single push. The single push is intentional
# — wehoop_wbb_data_trigger.yaml watches push events on main and fires the
# repository_dispatch to wehoop-wbb-data, so one push per day means one
# downstream dispatch per day.
#
# Cadence is staggered ~2h ahead of wehoop-wbb-data/daily_wbb.yml (which fires
# at 07:00 UTC) so the parser side always sees fresh raw JSON. The month/day
# windows mirror the in-season ranges used by the data repo's daily workflow
# so we don't burn compute scraping during the offseason.

# Serialize every workflow in this repo that commits to it. Two runs in flight put
# one of them behind origin and its push is rejected -- and where the git calls
# are swallowed with no rc check, that lands as a GREEN job that published
# nothing. Worked examples: wehoop-wnba-data runs 32192069433 + 32192069566, and
# hoopR-nba-data run 32204419012, all on 2026-08-18/19.
#
# cancel-in-progress is FALSE on purpose -- these runs upload release assets, and
# cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 6 18-31 10 *'  # late October (season opens)
    - cron: '30 6 * 11-12 *'   # November - December
    - cron: '30 6 * 1-4 *'     # January - April (regular season + conference tourneys)
    - cron: '30 6 1-12 4 *'    # early April (NCAA tournament tail)
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start season year (YYYY, e.g. 2026 for 2025-26)'
        required: false
        default: '2026'
      end_year:
        description: 'End season year (YYYY, e.g. 2026 for 2025-26)'
        required: false
        default: '2026'
      rescrape:
        description: 'Force re-scrape of files already on disk'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily_wbb_raw:
    runs-on: [self-hosted, sdv-droplet]
    env:
      START_YEAR: ${{ github.event.inputs.start_year || '2026' }}
      END_YEAR: ${{ github.event.inputs.end_year || '2026' }}
      RESCRAPE: ${{ github.event.inputs.rescrape || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SDV_GH_TOKEN }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Refresh and install dependencies
        # `uv lock --upgrade` re-resolves every dependency each run; the
        # refreshed uv.lock is committed alongside the scraped output below, so
        # the lock in git always records a resolution CI actually ran. A
        # resolution failure must fail the job -- do not add `|| true`.
        run: |
          uv lock --upgrade
          uv sync
          uv pip install .

      - name: Run offline tests
        run: uv run pytest -q

      - name: Scrape schedules
        run: uv run python python/espn_wbb_01_schedules_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape per-game JSON (PBP)
        run: uv run python python/espn_wbb_02_pbp_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape team rosters
        run: uv run python python/espn_wbb_08_team_rosters_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape player core
        run: uv run python python/espn_wbb_09_player_core_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape player season stats
        run: uv run python python/espn_wbb_06_player_season_stats_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape team season stats
        run: uv run python python/espn_wbb_07_team_season_stats_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape standings
        run: uv run python python/espn_wbb_03_standings_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape per-game rosters
        run: uv run python python/espn_wbb_04_game_rosters_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape per-game officials
        run: uv run python python/espn_wbb_10_officials_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Build schedule master + coverage index
        # LAST on purpose: it stamps each season schedule with the has_* capture
        # flags, which only means anything once steps 02-09 have finished.
        run: uv run python python/espn_wbb_99_schedule_master_creation.py --start_year "$START_YEAR" --end_year "$END_YEAR"

      - name: Commit any new JSON files
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add wbb/ uv.lock
          if [ -n "$(git status --porcelain)" ]; then
            # Commit message format must keep ONLY the start + end years
            # as digits. The downstream `wehoop-wbb-data` daily workflow
            # parses with `grep -oE '[0-9]+'` to extract START_YEAR
            # (head -1) and END_YEAR (tail -1). Extra numbers (date,
            # run id, etc.) get captured as END_YEAR and the parser
            # fails. Match the legacy bot format.
            git commit -m "WBB Raw Update (Start: ${{ env.START_YEAR }} End: ${{ env.END_YEAR }})"
            git push
          else
            echo "No new files to commit"
          fi
